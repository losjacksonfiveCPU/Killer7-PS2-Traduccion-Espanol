name: iDared 32bit IPA build (isolated)
on:
  push:
    branches:
      - chatgpt-idared32bit-build
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout Spanish build patch
        uses: actions/checkout@v4
      - name: Clone iDared 32bit official sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --branch v1.3.0 https://github.com/iDared32bit-emu/iDared32bit.git source
          git -C source rev-parse HEAD | tee SOURCE_COMMIT.txt
      - name: Patch NSDateFormatter timezone support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/src/frameworks/foundation/ns_date_formatter.rs")
          src = p.read_text()
          def substitute(old, new):
              global src
              count = src.count(old)
              assert count == 1, f"Expected one match, got {count}: {old[:90]!r}"
              src = src.replace(old, new, 1)
          
          substitute(
              "use crate::objc::{autorelease, id, msg, nil, objc_classes, ClassExports, HostObject, NSZonePtr};",
              "use crate::objc::{autorelease, id, msg, msg_class, nil, objc_classes, release, retain, ClassExports, HostObject, NSZonePtr};"
          )
          substitute(
              "    date_format: Option<id>,\n}",
              "    date_format: Option<id>,\n    time_zone: id,\n}"
          )
          substitute(
              "        date_format: None,\n",
              "        date_format: None,\n        time_zone: nil,\n"
          )
          substitute(
              "- (())setDateFormat:(id)format { // NSString *",
              """- (())dealloc {
              let (date_format, time_zone) = {
                  let state = env.objc.borrow::<NSDateFormatterHostObject>(this);
                  (state.date_format, state.time_zone)
              };
              if let Some(date_format) = date_format {
                  release(env, date_format);
              }
              if time_zone != nil {
                  release(env, time_zone);
              }
              env.objc.dealloc_object(this, &mut env.mem)
          }
          
          // Minimal implementation for games that configure NSDateFormatter timezone.
          // NSTimeZone currently reports GMT for all zones in iDared 32bit.
          - (())setTimeZone:(id)time_zone { // NSTimeZone *
              if time_zone != nil {
                  retain(env, time_zone);
              }
              let previous = std::mem::replace(
                  &mut env.objc.borrow_mut::<NSDateFormatterHostObject>(this).time_zone,
                  time_zone,
              );
              if previous != nil {
                  release(env, previous);
              }
          }
          
          - (id)timeZone {
              let stored = env.objc.borrow::<NSDateFormatterHostObject>(this).time_zone;
              if stored == nil {
                  msg_class![env; NSTimeZone defaultTimeZone]
              } else {
                  stored
              }
          }
          
          - (())setDateFormat:(id)format { // NSString *"""
          )
          substitute(
              """    let &NSDateFormatterHostObject {
                  date_format
              } = env.objc.borrow(this);""",
              """    let (date_format, time_zone) = {
                  let state = env.objc.borrow::<NSDateFormatterHostObject>(this);
                  (state.date_format, state.time_zone)
              };"""
          )
          substitute(
              "    let greg_date = CFAbsoluteTimeGetGregorianDate(env, ti, nil);",
              """    let offset: i32 = if time_zone == nil {
                  0
              } else {
                  msg![env; time_zone secondsFromGMT]
              };
              let greg_date = CFAbsoluteTimeGetGregorianDate(env, ti + f64::from(offset), nil);"""
          )
          p.write_text(src)
          print("Applied NSDateFormatter.setTimeZone: compatibility patch")
          PY
      - name: Translate and fix UI and settings (source-level)
        shell: bash
        run: |
          set -euo pipefail
          python3 buildtools/idared_es_glass.py
      - name: Fix NSBundle bundleWithPath for older games
        shell: bash
        run: |
          set -euo pipefail
          python3 buildtools/idared_nsbundle_fix.py
          grep -q 'bundleWithPath:(id)path' source/src/frameworks/foundation/ns_bundle.rs
      - name: Install compatible CMake 3.31.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "${RUNNER_TEMP}/cmake-3.31.6.tar.gz" https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          mkdir -p "${RUNNER_TEMP}/cmake-3.31"
          tar -xzf "${RUNNER_TEMP}/cmake-3.31.6.tar.gz" -C "${RUNNER_TEMP}/cmake-3.31"
          cmake_bin="${RUNNER_TEMP}/cmake-3.31/cmake-3.31.6-macos-universal/CMake.app/Contents/bin"
          test -x "${cmake_bin}/cmake"
          echo "${cmake_bin}" >> "${GITHUB_PATH}"
          "${cmake_bin}/cmake" --version
      - name: Prepare iOS build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          cmake --version
          rustc --version
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          xcodebuild -list -project source/iphone/touchHLE.xcodeproj
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          cd source
          set -o pipefail
          xcodebuild -project iphone/touchHLE.xcodeproj -scheme 'iDared 32bit' -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "${GITHUB_WORKSPACE}/build" CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' build 2>&1 | tee "${GITHUB_WORKSPACE}/xcodebuild.log"
      - name: Package IPA and validate
        shell: bash
        run: |
          set -euo pipefail
          products="${GITHUB_WORKSPACE}/build/Build/Products/Release-iphoneos"
          app=$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)
          if [[ -z "$app" ]]; then
            echo "ERROR: iOS app was not generated"
            exit 1
          fi
          binary=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          test -s "$app/$binary"
          file "$app/$binary"
          mkdir -p dist/Payload
          ditto "$app" "dist/Payload/$(basename "$app")"
          (cd dist && zip -qry iDared32bit-v1.3.0-es-negro-nsbundle-fix-unsigned.ipa Payload)
          unzip -t dist/iDared32bit-v1.3.0-es-negro-nsbundle-fix-unsigned.ipa | tail -n 1
          test -s dist/iDared32bit-v1.3.0-es-negro-nsbundle-fix-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iDared32bit-v1.3.0-es-negro-nsbundle-fix-unsigned
          path: dist/iDared32bit-v1.3.0-es-negro-nsbundle-fix-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iDared32bit-build-logs
          path: |
            xcodebuild.log
            SOURCE_COMMIT.txt
          if-no-files-found: ignore
          retention-days: 3
